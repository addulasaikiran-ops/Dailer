name: open_dialer
description: OpenDialer — A clean, modern, open-source Android dialer app.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Database
  sqflite: ^2.3.2
  path: ^1.9.0

  # Platform / Telecom
  permission_handler: ^11.3.1
  contacts_service: ^0.6.3
  flutter_contacts: ^1.1.9+1

  # UI / UX
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  shimmer: ^3.0.0
  sliding_up_panel: ^2.0.0+1
  flutter_slidable: ^3.1.0
  intl: ^0.19.0

  # Audio / Recording
  record: ^5.1.0
  just_audio: ^0.9.38
  path_provider: ^2.1.3
  share_plus: ^9.0.0

  # Utils
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.2
  uuid: ^4.4.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.4.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.3.12
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.12
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/sounds/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
